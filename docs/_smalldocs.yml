project:
  type: website
  output-dir: _site
  resources: [CNAME]

website:
  title: smalldocs
  description: Quarto-like websites in pure Python
  site-url: https://docs.smallish.dev/
  repo-url: https://github.com/rahuldave/smalldocs
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: guide/get-started.qmd
        text: Guide
      - href: api/site.qmd
        text: Reference
      - href: news/index.qmd
        text: News
    tools:
      - icon: github
        href: https://github.com/rahuldave/smalldocs
  sidebar:
    style: floating
    contents:
      - section: Guide
        contents: guide/*
      - section: Reference
        contents: api/*
      - section: Notebook examples
        contents:
          - guide/browser-plot/index.ipynb
          - guide/browser-data/index.ipynb
  page-footer:
    left: "A [smallish.dev](https://smallish.dev/) project. MIT-licensed."
    right: "Built with [smalldocs](https://github.com/rahuldave/smalldocs)."

theme: folio
toc: true
code-copy: true

linkify: true
browser-notebooks: true
api:
  packages: [smalldocs]
  root: ..
  source: https://github.com/rahuldave/smalldocs/blob/main
