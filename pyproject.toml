[project]
name = "smalldocs"
version = "0.1.3"
description = "Quarto-like websites from a _quarto.yml project, in pure Python: pages, API reference and listings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/smalldocs/assets/vendor/*/LICENSE*"]
authors = [{ name = "Rahul Dave", email = "rahuldave@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastcore>=1.8",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pyyaml>=6.0",
    "pygments>=2.17",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/rahuldave/smalldocs"

[project.scripts]
smalldocs = "smalldocs.cli:main"

[dependency-groups]
dev = ["click>=8", "pydantic>=2", "pytest>=8", "pytest-timeout>=2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
